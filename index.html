<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Receptář</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('receptar-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4e1d7;--paper:#fcf7f3;--ink:#2b2321;--soft:#7b625a;--rose:#dba993;--deep:#96523d;--deep-h:#7e4332;--on-deep:#fff;--tint:#efd2c5;--line:#e5c7ba;--field:#fffaf6;--wave:#ecc9ba;--shadow:rgba(130,75,55,.4);
--r:14px;color-scheme:light}
:root[data-theme=dark]{--bg:#211a18;--paper:#2c2220;--ink:#f4e6de;--soft:#bfa69c;--rose:#8a5a4a;--deep:#e3a68e;--deep-h:#f0bda8;--on-deep:#2a1812;--tint:#3b2b27;--line:#4a3832;--field:#211a18;--wave:#2f2320;--shadow:rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:12px}
body{margin:0;position:relative;overflow-x:hidden;background:var(--bg);color:var(--ink);font:400 14px/1.6 'Roboto Mono',ui-monospace,Menlo,monospace;min-height:100vh}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:99;opacity:.38;mix-blend-mode:multiply;
background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .3 0 0 0 0 .2 0 0 0 0 .18 0 0 0 .7 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");}
.wrap{position:relative;max-width:1000px;margin:0 auto;padding:max(28px,env(safe-area-inset-top)) 20px 60px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:26px}
h1{font-size:clamp(34px,8vw,56px);line-height:1;margin:0;font-weight:700;letter-spacing:-.04em;color:var(--ink)}
header p{margin:8px 0 0;color:var(--soft)}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--deep);outline-offset:2px}
.btn{background:var(--deep);color:var(--on-deep);border:0;border-radius:999px;padding:10px 20px;font-weight:500}
.btn:hover{background:var(--deep-h)}
.ghost{background:var(--paper);border:1px solid var(--rose);border-radius:999px;padding:8px 16px;color:var(--deep)}
.ghost:hover{background:var(--tint)}
.hb{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.round{width:40px;height:40px;padding:0;display:inline-flex;align-items:center;justify-content:center}
.ico-sun{display:none}
[data-theme=dark] .ico-sun{display:block}
[data-theme=dark] .ico-moon{display:none}
[data-theme=dark] body::after{filter:invert(1);mix-blend-mode:screen;opacity:.12}
.wave{position:absolute;top:0;left:0;right:0;height:300px;z-index:-1;background:var(--wave);-webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 300' preserveAspectRatio='none'><path d='M0 0H1000V140C860 240 720 60 540 125C360 190 190 280 0 195Z'/></svg>") 0 0/100% 100% no-repeat;mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1000 300' preserveAspectRatio='none'><path d='M0 0H1000V140C860 240 720 60 540 125C360 190 190 280 0 195Z'/></svg>") 0 0/100% 100% no-repeat}
.wave::before{content:"";position:absolute;inset:0;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='150' height='150' fill='none' stroke='%234a342b' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'><g transform='rotate(-35 35 35)'><rect x='12' y='28' width='46' height='14' rx='6'/><path d='M12 35H4M58 35H66'/></g><path d='M85 32h40c0 14-9 24-20 24s-20-10-20-24z'/><path d='M94 24c4-6 8 2 12-4s8 2 12-2'/><path d='M45 128c-12-14-12-30 0-44 12 14 12 30 0 44zM45 128c-5-14-5-30 0-44M45 128c5-14 5-30 0-44M45 128v14'/><path d='M112 100c0-10 6-14 12-14 8 0 12 8 10 18l-2 14h-18z'/></svg>");opacity:.2}
[data-theme=dark] .wave::before{filter:invert(1);opacity:.1}
.search{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;font:inherit;color:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 24px}
.chip{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:5px 14px;color:var(--soft)}
.chip.on{background:var(--deep);border-color:var(--deep);color:var(--on-deep)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.card{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:20px 20px 18px;text-align:left;box-shadow:0 1px 0 var(--line),0 10px 24px -16px var(--shadow);transition:transform .15s}
.card:hover{transform:translateY(-3px) rotate(-.4deg)}
.card h3{margin:0 34px 6px 0;font-size:17px;line-height:1.3}
.tag{display:inline-block;background:var(--tint);color:var(--deep);border-radius:6px;padding:1px 9px;font-size:12px}
.meta{margin-top:12px;color:var(--soft);font-size:12px;display:flex;gap:14px;flex-wrap:wrap}
.open{position:absolute;inset:0;background:none;border:0;border-radius:var(--r)}
.heart{position:absolute;top:14px;right:14px;z-index:2;background:none;border:0;font-size:20px;line-height:1;color:var(--rose);padding:4px}
.heart.on{color:#d63f4f}
.empty{grid-column:1/-1;text-align:center;color:var(--soft);padding:50px 10px;border:1px dashed var(--rose);border-radius:var(--r)}
footer{margin-top:40px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
dialog{background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:0;width:min(640px,calc(100vw - 24px));max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px);box-shadow:0 30px 60px -20px rgba(50,25,15,.5)}
dialog::backdrop{background:rgba(35,20,15,.5)}
.in{padding:26px 24px 22px}
.in h2{margin:0 0 6px;font-size:24px;line-height:1.2;color:var(--deep)}
.cols{display:grid;grid-template-columns:1fr;gap:6px 28px;margin-top:18px}
@media(min-width:620px){.cols{grid-template-columns:5fr 7fr}}
h4{margin:14px 0 6px;font-size:14px;color:var(--deep)}
ul,ol{margin:0;padding-left:20px}
li{margin-bottom:6px}
.note{margin-top:16px;padding:12px 14px;background:var(--tint);border-radius:10px;color:var(--soft)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-top:22px}
label{display:block;margin-top:14px;color:var(--soft);font-size:12px}
input.f,textarea.f{width:100%;margin-top:4px;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font:inherit;color:var(--ink)}
textarea.f{min-height:110px;resize:vertical}
.lb{margin-top:14px;color:var(--soft);font-size:12px}
.ir{display:flex;gap:8px;align-items:center}
.ir .f{flex:1}
.rm{background:none;border:0;color:var(--soft);font-size:20px;line-height:1;padding:4px 8px}
.rm:hover{color:var(--deep)}
#ingadd{margin-top:8px}
.two{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:520px){.two{grid-template-columns:1fr}}
.search,input.f,textarea.f{font-size:16px}
.lang{display:inline-flex;height:40px;border:1px solid var(--rose);border-radius:999px;background:var(--paper);overflow:hidden}
.lang button{border:0;background:none;padding:0 13px;font-weight:500;color:var(--deep)}
.lang button.on{background:var(--deep);color:var(--on-deep)}
.ex{margin-top:18px;padding:14px;border:1px dashed var(--rose);border-radius:12px;background:var(--bg)}
.ex .lb{margin-top:12px}
.exh{display:flex;gap:8px;align-items:center}
.exh .f{flex:1;font-weight:500}
.exai{margin-top:8px}
#exadd{margin-top:14px}
.exv{margin:26px 0 0;padding-top:16px;border-top:1px solid var(--line);font-size:17px;line-height:1.3;color:var(--deep)}
dialog{overflow-y:auto;overscroll-behavior:contain}
body.lock{position:fixed;left:0;right:0;width:100%}
</style>
</head>
<body>
<div class="wave" aria-hidden="true"></div>
<div class="wrap">
  <header>
    <div><h1>Receptář</h1></div>
    <div class="hb"><div class="lang" role="group" aria-label="Jazyk"><button type="button" data-l="sk">SK</button><button type="button" data-l="cs">CZ</button></div><button class="ghost round" id="theme" data-i18n-aria="theme" aria-label="Prepnúť svetlý a tmavý režim" title="Svetlý / tmavý režim"><svg class="ico-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><svg class="ico-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button><button class="ghost" id="rnd" data-i18n="rnd">Náhodný recept</button><button class="btn" id="add" data-i18n="add">+ Nový recept</button></div>
  </header>
  <input class="search" id="q" type="search" placeholder="Hľadaj podľa názvu alebo ingrediencie" data-i18n-ph="sph" aria-label="Hľadať" data-i18n-aria="sar">
  <div class="chips" id="chips"></div>
  <div class="grid" id="list"></div>
  <footer>
    <button class="ghost" id="exp" data-i18n="exp">Stiahnuť zálohu</button>
    <button class="ghost" id="imp" data-i18n="imp">Nahrať zálohu</button>
    <input type="file" id="file" accept="application/json" hidden>
  </footer>
</div>

<dialog id="view"><div class="in" id="vbody"></div></dialog>

<dialog id="form"><form class="in" id="fm">
  <h2 id="ftitle">Nový recept</h2>
  <label><span data-i18n="lname">Názov</span><input class="f" name="title" required maxlength="80"></label>
  <div class="two">
    <label><span data-i18n="lcat">Kategória</span><input class="f" name="cat" list="cl" required maxlength="30"></label>
    <label><span data-i18n="ltime">Čas prípravy</span><input class="f" name="time" data-i18n-ph="phtime" placeholder="napr. 45 min" maxlength="20"></label>
    <label><span data-i18n="lserv">Porcie</span><input class="f" name="serv" data-i18n-ph="phserv" placeholder="napr. 4" maxlength="10"></label>
  </div>
  <datalist id="cl"></datalist>
  <div class="lb" data-i18n="ing">Ingrediencie</div><div id="ingl"></div><button type="button" class="ghost" id="ingadd" data-i18n="ingadd">+ Pridať ingredienciu</button>
  <label><span data-i18n="lsteps">Postup (každý krok na nový riadok)</span><textarea class="f" name="steps" required></textarea></label>
  <div id="exl"></div><button type="button" class="ghost" id="exadd" data-i18n="exadd">+ Pridať doplnok (napr. poleva)</button>
  <label><span data-i18n="lnote">Poznámka</span><input class="f" name="note" maxlength="200"></label>
  <div class="row">
    <button type="button" class="ghost" id="cancel" data-i18n="cancel">Zrušiť</button>
    <button class="btn" type="submit" data-i18n="save">Uložiť recept</button>
  </div>
</form></dialog>

<script>
const KEY='receptar-v1';
const DEFS={sk:['Raňajky','Polievky','Hlavné jedlá','Prílohy','Šaláty','Pečenie','Dezerty'],cs:['Snídaně','Polévky','Hlavní jídla','Přílohy','Saláty','Pečení','Dezerty']};
const T={
sk:{sph:'Hľadaj podľa názvu alebo ingrediencie',sar:'Hľadať',theme:'Prepnúť svetlý a tmavý režim',themet:'Svetlý / tmavý režim',rnd:'Náhodný recept',add:'+ Nový recept',exp:'Stiahnuť zálohu',imp:'Nahrať zálohu',all:'Všetko',fav:'Obľúbené',serv:'porcie',ingn:'ingrediencií',nf:'Nič sa nenašlo. Skús iné slovo alebo kategóriu.',none:'Zatiaľ tu nie je žiadny recept. Pridaj prvý tlačidlom Nový recept.',open:'Otvoriť',ing:'Ingrediencie',steps:'Postup',del:'Zmazať',edit:'Upraviť',close:'Zavrieť',delq:'Naozaj zmazať tento recept?',ftnew:'Nový recept',ftedit:'Upraviť recept',lname:'Názov',lcat:'Kategória',ltime:'Čas prípravy',lserv:'Porcie',phtime:'napr. 45 min',phserv:'napr. 4',ingadd:'+ Pridať ingredienciu',phing:'napr. 250 g múky',ingaria:'Ingrediencia',rmaria:'Odstrániť ingredienciu',lsteps:'Postup (každý krok na nový riadok)',lnote:'Poznámka',cancel:'Zrušiť',save:'Uložiť recept',needing:'Pridaj aspoň jednu ingredienciu.',badfile:'Súbor sa nepodarilo načítať. Použi zálohu stiahnutú z Receptáře.',nrnd:'Zatiaľ tu nie je žiadny recept.',exadd:'+ Pridať doplnok (napr. poleva)',exn:'Názov doplnku, napr. Poleva',exrm:'Odstrániť doplnok',exdef:'Doplnok'},
cs:{sph:'Hledej podle názvu nebo ingredience',sar:'Hledat',theme:'Přepnout světlý a tmavý režim',themet:'Světlý / tmavý režim',rnd:'Náhodný recept',add:'+ Nový recept',exp:'Stáhnout zálohu',imp:'Nahrát zálohu',all:'Vše',fav:'Oblíbené',serv:'porce',ingn:'ingrediencí',nf:'Nic se nenašlo. Zkus jiné slovo nebo kategorii.',none:'Zatím tu není žádný recept. Přidej první tlačítkem Nový recept.',open:'Otevřít',ing:'Ingredience',steps:'Postup',del:'Smazat',edit:'Upravit',close:'Zavřít',delq:'Opravdu smazat tento recept?',ftnew:'Nový recept',ftedit:'Upravit recept',lname:'Název',lcat:'Kategorie',ltime:'Čas přípravy',lserv:'Porce',phtime:'např. 45 min',phserv:'např. 4',ingadd:'+ Přidat ingredienci',phing:'např. 250 g mouky',ingaria:'Ingredience',rmaria:'Odstranit ingredienci',lsteps:'Postup (každý krok na nový řádek)',lnote:'Poznámka',cancel:'Zrušit',save:'Uložit recept',needing:'Přidej alespoň jednu ingredienci.',badfile:'Soubor se nepodařilo načíst. Použij zálohu stáhnutou z Receptáře.',nrnd:'Zatím tu není žádný recept.',exadd:'+ Přidat doplněk (např. poleva)',exn:'Název doplňku, např. Poleva',exrm:'Odstranit doplněk',exdef:'Doplněk'}};
let L='sk';try{const l=localStorage.getItem('receptar-lang');if(l==='sk'||l==='cs')L=l}catch(e){}
const t=k=>T[L][k];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lines=t=>t.split('\n').map(x=>x.trim()).filter(Boolean);
const SAMPLES={
sk:{id:'s1',title:'Palacinky',cat:'Dezerty',time:'25 min',serv:'4',fav:true,ing:['250 g hladkej múky','2 vajcia','500 ml mlieka','štipka soli','olej na vyprážanie'],steps:['Zmiešaj múku, vajcia, mlieko a soľ na hladké cesto.','Nechaj cesto 10 minút odpočinúť.','Na rozohriatej panvici s trochou oleja opeč tenké palacinky z oboch strán.','Plň podľa chuti, napríklad džemom alebo tvarohom.'],note:'Toto je ukážka, môžeš ju zmazať alebo upraviť.'},
cs:{id:'s1',title:'Palačinky',cat:'Dezerty',time:'25 min',serv:'4',fav:true,ing:['250 g hladké mouky','2 vejce','500 ml mléka','špetka soli','olej na smažení'],steps:['Smíchej mouku, vejce, mléko a sůl na hladké těsto.','Nech těsto 10 minut odpočinout.','Na rozehřáté pánvi s trochou oleje opeč tenké palačinky z obou stran.','Plň podle chuti, například džemem nebo tvarohem.'],note:'Toto je ukázka, můžeš ji smazat nebo upravit.'}};
let R=load(),cat='__all',q='',editId=null;
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(d))return d}catch(e){}return [SAMPLES[L]]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(R))}catch(e){}}
const cats=()=>[...new Set([...DEFS[L],...R.map(r=>r.cat)])];

function render(){
  const used=[...new Set(R.map(r=>r.cat))].sort((a,b)=>a.localeCompare(b,L==='cs'?'cs':'sk'));
  const all=[['__all',t('all')],...(R.some(r=>r.fav)?[['__fav','♥ '+t('fav')]]:[]),...used.map(c=>[c,c])];
  if(!all.some(c=>c[0]===cat))cat='__all';
  $('#chips').innerHTML=all.map(c=>`<button class="chip${c[0]===cat?' on':''}" data-c="${esc(c[0])}">${esc(c[1])}</button>`).join('');
  const s=q.trim().toLowerCase();
  const out=R.filter(r=>(cat==='__all'||(cat==='__fav'?r.fav:r.cat===cat))&&(!s||(r.title+' '+r.ing.join(' ')+' '+(r.extras||[]).map(x=>x.name+' '+x.ing.join(' ')).join(' ')).toLowerCase().includes(s)));
  $('#list').innerHTML=out.length?out.map(r=>`<article class="card">
    <h3>${esc(r.title)}</h3><span class="tag">${esc(r.cat)}</span>
    <div class="meta">${r.time?`<span>${esc(r.time)}</span>`:''}${r.serv?`<span>${esc(r.serv)} ${t('serv')}</span>`:''}<span>${r.ing.length} ${t('ingn')}</span>${(r.extras||[]).length?`<span>+ ${esc(r.extras.map(x=>x.name).join(', '))}</span>`:''}</div>
    <button class="open" data-o="${r.id}" aria-label="${t('open')} ${esc(r.title)}"></button>
    <button class="heart${r.fav?' on':''}" data-h="${r.id}" aria-label="${t('fav')}">${r.fav?'♥':'♡'}</button></article>`).join('')
   :`<div class="empty">${R.length?t('nf'):t('none')}</div>`;
}
$('#chips').onclick=e=>{const c=e.target.closest('[data-c]');if(c){cat=c.dataset.c;render()}};
$('#q').oninput=e=>{q=e.target.value;render()};
$('#list').onclick=e=>{
  const h=e.target.closest('[data-h]');
  if(h){const r=R.find(x=>x.id===h.dataset.h);r.fav=!r.fav;save();render();return}
  const o=e.target.closest('[data-o]');if(o)show(o.dataset.o);
};
function show(id){
  const r=R.find(x=>x.id===id);if(!r)return;
  $('#vbody').innerHTML=`<h2>${esc(r.title)}</h2><span class="tag">${esc(r.cat)}</span>
  <div class="meta">${r.time?`<span>${esc(r.time)}</span>`:''}${r.serv?`<span>${esc(r.serv)} ${t('serv')}</span>`:''}</div>
  <div class="cols"><div><h4>${t('ing')}</h4><ul>${r.ing.map(i=>`<li>${esc(i)}</li>`).join('')}</ul></div>
  <div><h4>${t('steps')}</h4><ol>${r.steps.map(i=>`<li>${esc(i)}</li>`).join('')}</ol></div></div>
  ${(r.extras||[]).map(exView).join('')}
  ${r.note?`<div class="note">${esc(r.note)}</div>`:''}
  <div class="row"><button class="ghost" data-x="del" data-id="${r.id}">${t('del')}</button><button class="ghost" data-x="edit" data-id="${r.id}">${t('edit')}</button><button class="btn" data-x="close">${t('close')}</button></div>`;
  $('#view').showModal();
}
$('#view').onclick=e=>{
  const b=e.target.closest('[data-x]');
  if(b){
    if(b.dataset.x==='close')$('#view').close();
    if(b.dataset.x==='edit'){$('#view').close();openForm(b.dataset.id)}
    if(b.dataset.x==='del'&&confirm(t('delq'))){R=R.filter(x=>x.id!==b.dataset.id);save();$('#view').close();render()}
  } else if(e.target===$('#view'))$('#view').close();
};
function openForm(id){
  editId=id||null;const f=$('#fm'),r=id&&R.find(x=>x.id===id);
  $('#ftitle').textContent=r?t('ftedit'):t('ftnew');
  f.title.value=r?r.title:'';f.cat.value=r?r.cat:'';f.time.value=r?r.time||'':'';f.serv.value=r?r.serv||'':'';
  $('#exl').innerHTML='';(r&&r.extras||[]).forEach(x=>exBlock(x));$('#ingl').innerHTML='';(r?r.ing:['']).forEach(v=>ingRow(v));f.steps.value=r?r.steps.join('\n'):'';f.note.value=r?r.note||'':'';
  $('#cl').innerHTML=cats().map(c=>`<option value="${esc(c)}">`).join('');
  $('#form').showModal();
}
function ingRow(v='',after,box){
  const d=document.createElement('div');d.className='ir';
  const i=document.createElement('input');i.className='f';i.maxLength=80;i.value=v;i.placeholder=t('phing');i.setAttribute('aria-label',t('ingaria'));
  const b=document.createElement('button');b.type='button';b.className='rm';b.textContent='×';b.setAttribute('aria-label',t('rmaria'));
  d.append(i,b);
  if(after)after.after(d);else(box||$('#ingl')).append(d);
  return i;
}
function bindIng(box){
  box.onkeydown=e=>{
    if(e.key==='Enter'&&e.target.tagName==='INPUT'){e.preventDefault();ingRow('',e.target.parentNode,box).focus()}
  };
  box.onclick=e=>{
    const b=e.target.closest('.rm');if(!b)return;
    if(box.querySelectorAll('.ir').length>1)b.parentNode.remove();else b.previousSibling.value='';
  };
}
bindIng($('#ingl'));
$('#ingadd').onclick=()=>ingRow('').focus();
function exBlock(x){
  x=x||{name:'',ing:[''],steps:[]};
  const d=document.createElement('div');d.className='ex';
  d.innerHTML=`<div class="exh"><input class="f exn" maxlength="40" placeholder="${esc(t('exn'))}" aria-label="${esc(t('exn'))}"><button type="button" class="rm exrm" aria-label="${esc(t('exrm'))}">×</button></div><div class="lb">${t('ing')}</div><div class="ingl"></div><button type="button" class="ghost exai">${t('ingadd')}</button><div class="lb">${t('lsteps')}</div><textarea class="f exs"></textarea>`;
  d.querySelector('.exn').value=x.name||'';
  d.querySelector('.exs').value=(x.steps||[]).join('\n');
  const box=d.querySelector('.ingl');bindIng(box);
  (x.ing&&x.ing.length?x.ing:['']).forEach(v=>ingRow(v,null,box));
  d.querySelector('.exai').onclick=()=>ingRow('',null,box).focus();
  d.querySelector('.exrm').onclick=()=>d.remove();
  d.querySelector('.exn').onkeydown=e=>{if(e.key==='Enter')e.preventDefault()};
  $('#exl').append(d);
  return d;
}
$('#exadd').onclick=()=>exBlock().querySelector('.exn').focus();
function getExtras(){
  return [...document.querySelectorAll('#exl .ex')].map(b=>({
    name:b.querySelector('.exn').value.trim(),
    ing:[...b.querySelectorAll('.ingl input')].map(i=>i.value.trim()).filter(Boolean),
    steps:lines(b.querySelector('.exs').value)
  })).filter(x=>x.ing.length||x.steps.length).map(x=>({...x,name:x.name||t('exdef')}));
}
const exView=x=>`<h3 class="exv">${esc(x.name)}</h3><div class="cols"><div>${x.ing.length?`<h4>${t('ing')}</h4><ul>${x.ing.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>`:''}</div><div>${x.steps.length?`<h4>${t('steps')}</h4><ol>${x.steps.map(i=>`<li>${esc(i)}</li>`).join('')}</ol>`:''}</div></div>`;
$('#theme').onclick=()=>{const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem('receptar-theme',t)}catch(e){}};
$('#add').onclick=()=>openForm();
let lastRnd=null;
$('#rnd').onclick=()=>{
  if(!R.length){alert(t('nrnd'));return}
  const pool=R.length>1?R.filter(r=>r.id!==lastRnd):R;
  const r=pool[Math.floor(Math.random()*pool.length)];
  lastRnd=r.id;show(r.id);
};
$('#cancel').onclick=()=>$('#form').close();
$('#fm').onsubmit=e=>{
  e.preventDefault();const f=e.target;
  const d={title:f.title.value.trim(),cat:f.cat.value.trim(),time:f.time.value.trim(),serv:f.serv.value.trim(),ing:[...document.querySelectorAll('#ingl input')].map(i=>i.value.trim()).filter(Boolean),steps:lines(f.steps.value),note:f.note.value.trim(),extras:getExtras()};
  if(!d.ing.length){alert(t('needing'));document.querySelector('#ingl input').focus();return}
  if(editId){Object.assign(R.find(x=>x.id===editId),d)}else R.unshift({id:Date.now().toString(36),fav:false,...d});
  save();$('#form').close();render();
};
$('#exp').onclick=()=>{
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(R,null,2)],{type:'application/json'}));
  a.download='receptar-zaloha.json';a.click();URL.revokeObjectURL(a.href);
};
$('#imp').onclick=()=>$('#file').click();
$('#file').onchange=e=>{
  const fl=e.target.files[0];if(!fl)return;
  fl.text().then(t=>{
    const d=JSON.parse(t);if(!Array.isArray(d))throw 0;
    d.filter(x=>x&&x.id&&x.title&&Array.isArray(x.ing)&&Array.isArray(x.steps)).forEach(x=>{x.extras=(Array.isArray(x.extras)?x.extras:[]).filter(e=>e&&Array.isArray(e.ing)&&Array.isArray(e.steps));if(!R.some(r=>r.id===x.id))R.push(x)});
    save();render();
  }).catch(()=>alert(t('badfile')));
  e.target.value='';
};
let lockY=0;
function lockScroll(){
  if(document.body.classList.contains('lock'))return;
  lockY=window.scrollY;
  document.body.style.top=-lockY+'px';
  document.body.classList.add('lock');
}
function unlockScroll(){
  if(document.querySelector('dialog[open]')||!document.body.classList.contains('lock'))return;
  document.body.classList.remove('lock');
  document.body.style.top='';
  window.scrollTo(0,lockY);
}
document.querySelectorAll('dialog').forEach(d=>{
  const sm=d.showModal.bind(d);
  d.showModal=()=>{lockScroll();sm()};
  d.addEventListener('close',unlockScroll);
});
function applyLang(){
  document.documentElement.lang=L==='cs'?'cs':'sk';
  document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));
  document.querySelectorAll('[data-i18n-ph]').forEach(e=>e.placeholder=t(e.dataset.i18nPh));
  document.querySelectorAll('[data-i18n-aria]').forEach(e=>e.setAttribute('aria-label',t(e.dataset.i18nAria)));
  $('#theme').title=t('themet');
  document.querySelectorAll('#ingl input').forEach(i=>{i.placeholder=t('phing');i.setAttribute('aria-label',t('ingaria'))});
  document.querySelectorAll('#ingl .rm').forEach(b=>b.setAttribute('aria-label',t('rmaria')));
  document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===L));
}
document.querySelector('.lang').onclick=e=>{
  const b=e.target.closest('[data-l]');if(!b||b.dataset.l===L)return;
  L=b.dataset.l;try{localStorage.setItem('receptar-lang',L)}catch(x){}
  cat='__all';applyLang();render();
};
applyLang();render();
</script>
</body>
</html>
